<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Join a game — Charades Champ</title>
<!--
  Multiplayer join page.

  HAND-WRITTEN. Not generated by scripts/build-site.mjs like the rest of this
  site — it is listed in that script's KEEP set so a rebuild cannot delete it.

  WHY THIS EXISTS. A charades game is played on one phone by five people; the
  other four never touch the app and never have a reason to install it. This is
  the Jackbox answer: every player opens the game on their own phone. The host
  phone is the board, and this page shows the word to act. No install required
  to join — the "get the app" ask comes after they have already played.
-->
<style>
  :root {
    --bg1: #0EA5E9; --bg2: #7C3AED; --bg3: #EC4899;
    --card: rgba(255,255,255,0.14);
    --text: #fff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: Nunito, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(150deg, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%);
    background-attachment: fixed;
    color: var(--text);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: max(env(safe-area-inset-top), 20px) 20px max(env(safe-area-inset-bottom), 20px);
    text-align: center;
  }
  h1 { font-size: clamp(26px, 7vw, 34px); font-weight: 900; margin: 0 0 6px; }
  .sub { opacity: .85; font-weight: 600; font-size: clamp(13px, 3.6vw, 15px); margin-bottom: 26px; }
  .panel { width: 100%; max-width: 420px; }
  input {
    width: 100%; border: none; border-radius: 14px; padding: 16px;
    font-family: inherit; font-size: 17px; font-weight: 800; text-align: center;
    margin-bottom: 10px; background: rgba(255,255,255,0.92); color: #1e1b4b;
  }
  #code { text-transform: uppercase; letter-spacing: 6px; font-size: 26px; font-weight: 900; }
  button {
    width: 100%; border: none; border-radius: 14px; padding: 16px;
    font-family: inherit; font-size: 17px; font-weight: 900; cursor: pointer;
    background: #fff; color: #7C3AED; margin-top: 4px;
  }
  button[disabled] { opacity: .55; cursor: default; }
  .err { color: #FFE4E6; background: rgba(190,18,60,.35); border-radius: 12px;
         padding: 10px 12px; font-weight: 700; font-size: 14px; margin-top: 12px; }
  .word {
    font-size: clamp(32px, 11vw, 60px); font-weight: 900; line-height: 1.1;
    margin: 18px 0; word-break: break-word;
  }
  .label { font-size: 12px; letter-spacing: 1.5px; font-weight: 900; opacity: .8; }
  .pill { display:inline-block; background: var(--card); border-radius: 999px;
          padding: 8px 16px; font-weight: 800; font-size: 14px; margin-top: 14px; }
  .cta { display:block; margin-top: 22px; color:#fff; font-weight:900; text-decoration:underline; }
  .spin { width: 34px; height: 34px; border: 4px solid rgba(255,255,255,.3);
          border-top-color: #fff; border-radius: 50%; margin: 20px auto;
          animation: s 1s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<div class="panel" id="screen-join">
  <h1>Join the game</h1>
  <div class="sub">Ask the host for the 4-letter code on their screen.</div>
  <input id="code" maxlength="4" autocomplete="off" autocapitalize="characters"
         inputmode="latin" placeholder="CODE" aria-label="Room code">
  <input id="name" maxlength="24" autocomplete="off" placeholder="Your name" aria-label="Your name">
  <button id="go">Join</button>
  <div id="err" class="err" hidden></div>
</div>

<div class="panel" id="screen-lobby" hidden>
  <h1>You're in</h1>
  <div class="sub">Waiting for the host to start…</div>
  <div class="spin"></div>
  <div class="pill" id="lobby-count">—</div>
</div>

<div class="panel" id="screen-word" hidden>
  <div class="label">ACT THIS OUT</div>
  <div class="word" id="word">—</div>
  <div class="sub">Don't show your screen to the guesser!</div>
</div>

<div class="panel" id="screen-over" hidden>
  <h1>Game over</h1>
  <div class="sub">Thanks for playing.</div>
  <a class="cta" href="https://play.google.com/store/apps/details?id=com.charadesparty.app">
    Get Charades Champ free →
  </a>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js';
import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js';
import { getDatabase, ref, get, set, onValue, onDisconnect }
  from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js';

// Public client config — ships in the APK too. Access is controlled by the
// Realtime Database rules, not by hiding these.
const app = initializeApp({
  apiKey: "AIzaSyBA3eerrH5ZYQoS55qmh_GovM3BnVdn0so",
  authDomain: "charades-party-c270c.firebaseapp.com",
  databaseURL: "https://charades-party-c270c-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "charades-party-c270c",
  appId: "1:162331664950:web:c3bbbfa950a79241d5ae97",
});
const db = getDatabase(app);

const $ = (id) => document.getElementById(id);
const screens = ['join', 'lobby', 'word', 'over'];
const show = (name) => screens.forEach((s) => { $('screen-' + s).hidden = s !== name; });
const fail = (msg) => { const e = $('err'); e.textContent = msg; e.hidden = false; };

// A stable id per device so a refresh rejoins as the same player instead of
// filling the lobby with ghosts.
function playerId() {
  try {
    let id = localStorage.getItem('cc-player-id');
    if (!id) { id = Math.random().toString(36).slice(2) + Date.now().toString(36);
               localStorage.setItem('cc-player-id', id); }
    return id;
  } catch { return 'p' + Math.random().toString(36).slice(2); }
}

// Prefill the code from ?c=ABCD so a host can share a link, not just digits.
const params = new URLSearchParams(location.search);
if (params.get('c')) $('code').value = params.get('c').toUpperCase().slice(0, 4);
try { $('name').value = localStorage.getItem('cc-player-name') || ''; } catch {}

$('go').addEventListener('click', join);
$('name').addEventListener('keydown', (e) => { if (e.key === 'Enter') join(); });

async function join() {
  const code = $('code').value.trim().toUpperCase();
  const name = $('name').value.trim().slice(0, 24) || 'Player';
  $('err').hidden = true;

  if (!/^[A-Z0-9]{4}$/.test(code)) return fail('That code should be 4 letters or numbers.');

  $('go').disabled = true;
  $('go').textContent = 'Joining…';
  try {
    await signInAnonymously(getAuth(app));

    const roomRef = ref(db, 'rooms/' + code);
    const snap = await get(roomRef);
    if (!snap.exists()) {
      fail("No game with that code. Check the host's screen.");
      return;
    }

    const pid = playerId();
    const meRef = ref(db, `rooms/${code}/players/${pid}`);
    await set(meRef, { name, joinedAt: Date.now(), score: 0 });
    onDisconnect(meRef).remove();   // leave cleanly if they close the tab
    try { localStorage.setItem('cc-player-name', name); } catch {}

    watch(code);
    show('lobby');
  } catch (e) {
    console.error(e);
    // Most likely causes, in order: this origin is not in Firebase Auth's
    // authorised domains, or the device is offline.
    fail('Could not join. Check your connection and try again.');
  } finally {
    $('go').disabled = false;
    $('go').textContent = 'Join';
  }
}

function watch(code) {
  onValue(ref(db, 'rooms/' + code), (snap) => {
    if (!snap.exists()) { show('over'); return; }
    const room = snap.val();
    const count = Object.keys(room.players || {}).length;
    $('lobby-count').textContent = count === 1 ? '1 player in' : count + ' players in';

    if (room.state === 'playing' && room.word) {
      $('word').textContent = room.word;
      show('word');
    } else if (room.state === 'ended') {
      show('over');
    } else {
      show('lobby');
    }
  }, () => show('over'));
}
</script>
</body>
</html>
